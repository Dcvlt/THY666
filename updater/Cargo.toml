[package]
name = "thy666-updater"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "THY666 application package inspection and bounded bootloader updater"
publish = false

[lib]
name = "thy666_updater"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde_json = "=1.0.145"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.3.4"

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
