name: Updater source checks

on:
  push:
    paths:
      - "updater/**"
      - "tools/build_updater.py"
      - "tests/test_updater_helper.py"
      - ".github/workflows/updater.yml"
  pull_request:
    paths:
      - "updater/**"
      - "tools/build_updater.py"
      - "tests/test_updater_helper.py"
      - ".github/workflows/updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Install the requested Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Synthetic tests and native release build
        run: python tools/build_updater.py --test
      - name: Loopback helper integration (simulation only)
        run: python -m unittest discover -s tests -p test_updater_helper.py -v
