name: Project site

on:
  push:
    branches: [main, master]
    paths:
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "tools/native_compile.py"
      - "site/**"
      - "web/**"
      - "core/**"
      - "host/wasm_bridge.c"
      - "web/help*"
      - "web/core.js"
      - "web/studio-menu.js"
      - "web/assets/**"
      - "docs/assets/thy666-icon.svg"
      - "tools/build_site.py"
      - "tools/build_browser_updater.py"
      - "tools/browser_updater_assets.py"
      - "updater/**"
      - "web/browser-*.js"
      - "web/device-client.js"
      - "web/updater-*"
      - "tests/web/browser-*.test.mjs"
      - "tests/web/updater-*.test.mjs"
      - "tools/prepare_desktop.py"
      - "tools/package_updater.py"
      - "tools/build_core.py"
      - "tools/setup_core_tools.py"
      - "tools/render_help_examples.mjs"
      - "tests/test_site.py"
      - "tests/web/help.test.mjs"
      - "tests/web/site.test.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "tools/native_compile.py"
      - "site/**"
      - "web/**"
      - "core/**"
      - "host/wasm_bridge.c"
      - "web/help*"
      - "web/core.js"
      - "web/studio-menu.js"
      - "web/assets/**"
      - "docs/assets/thy666-icon.svg"
      - "tools/build_site.py"
      - "tools/build_browser_updater.py"
      - "tools/browser_updater_assets.py"
      - "updater/**"
      - "web/browser-*.js"
      - "web/device-client.js"
      - "web/updater-*"
      - "tests/web/browser-*.test.mjs"
      - "tests/web/updater-*.test.mjs"
      - "tools/prepare_desktop.py"
      - "tools/package_updater.py"
      - "tools/build_core.py"
      - "tools/setup_core_tools.py"
      - "tools/render_help_examples.mjs"
      - "tests/test_site.py"
      - "tests/web/help.test.mjs"
      - "tests/web/site.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the portable Rust target
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build the shared browser updater policy without native USB
        run: python3 tools/build_browser_updater.py
      - name: Prepare the pinned compiler for documentation verification
        run: python3 tools/setup_core_tools.py
      - name: Build only the portable renderer, without private musical data
        run: python3 tools/build_core.py --wasm-only --core-only
      - name: Verify the bounded public site
        run: python3 -m unittest discover -s tests -p test_site.py -v
      - name: Verify shared guide, screenshots and site figures
        run: node --test tests/web/help.test.mjs tests/web/site.test.mjs tests/web/site-carousel.test.mjs tests/web/browser-*.test.mjs tests/web/updater-*.test.mjs
      - name: Build the project site and shared guide
        run: python3 tools/build_site.py
      - name: Upload only the public site
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
