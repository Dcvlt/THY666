[package]
name = "thy666-desktop"
version = "0.2.2"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "THY666 desktop Companion and integrated native updater"
publish = false
build = "build.rs"

[lib]
name = "thy666_desktop"
path = "src/lib.rs"

[[bin]]
name = "thy666-desktop"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
getrandom = "=0.3.4"
serialport = { version = "=4.10.1", default-features = false }
thy666-updater = { path = "../updater" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
